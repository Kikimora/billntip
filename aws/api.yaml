openapi: 3.0.0
info:
  title: Bill & Tip API
  version: 0.0.1
servers:
  - url: http://localhost:8080
paths:
  /businesses:
    get:
      summary: Retrieve a list of all businesses
      parameters:
        - name: next
          in: query
          schema: { type: string, required: false }
      responses:
        '200':
          description: A list of businesses
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BusinessList' } }
    post:
      summary: Create a new business
      requestBody:
        description: Business object that needs to be added to the database
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessRequest' }
      responses:
        '201':
          description: Business created successfully
  /businesses/{id}:
    parameters:
      - name: id
        in: path
        description: ID of the business to update
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Retrieve a business by ID
      responses:
        '200':
          description: Business object
          content:
            application/json: { schema: { $ref: '#/components/schemas/Business' } }
    put:
      summary: Update a business by ID
      requestBody:
        description: Business object that needs to be updated in the database
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessRequest'
      responses:
        '200':
          description: Business updated successfully
    delete:
      summary: Delete a business by ID
      responses:
        '204':
          description: Business deleted successfully
components:

  schemas:
    BusinessRequest:
      type: object
      properties:
        name: { type: string, required: true }
        address: { type: string }
    BusinessList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Business' }, required: true }
        next: { type: string }
    Business:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, required: true }
        address: { type: string }
